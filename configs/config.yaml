llm:
  default_provider: deepseek
  deepseek:
    api_key: YOUR_DEEPSEEK_API_KEY
    model: deepseek-chat
    base_url: https://api.deepseek.com/v1
  kimi:
    api_key: YOUR_KIMI_API_KEY
    model: moonshot-v1-32k
    base_url: https://api.moonshot.cn/v1
  minimax:
    api_key: YOUR_MINIMAX_API_KEY
    model: MiniMax-Text-01
    base_url: https://api.minimax.chat/v1
  zhipu:
    api_key: YOUR_ZHIPU_API_KEY
    model: glm-4
    base_url: https://open.bigmodel.cn/api/paas/v4
  gemini:
    api_key: YOUR_GEMINI_API_KEY
    model: gemini-1.5-pro
  ollama:
    base_url: http://localhost:11434/v1
    model: qwen2.5:latest
    api_key: ollama
image_gen:
  provider: nano_banana
  api_key: YOUR_GEMINI_API_KEY
  model: gemini-3-pro-image-preview
  output_resolution: 4K
video_gen:
  default_provider: kling
  kling:
    api_key: YOUR_KLING_API_KEY
    api_secret: YOUR_KLING_API_SECRET
    model: kling-v3
    base_url: https://api-beijing.klingai.com
    default_duration: 5
    default_ratio: '16:9'
    default_quality: high
  seedance:
    api_key: YOUR_VOLCENGINE_API_KEY
    model: doubao-seedance-1-5-pro-250528
    base_url: https://ark.cn-beijing.volces.com/api/v3
    default_duration: 5
    default_ratio: '16:9'
tts:
  default_provider: minimax
  minimax:
    api_key: YOUR_MINIMAX_API_KEY
    model: speech-02-hd
    default_voice: female-shaonv
    speed: 1.0
    emotion: neutral
local:
  ffmpeg_path: ffmpeg
  whisperx_model: base
  output_dir: ./data/outputs
  assets_dir: ./data/assets
  temp_dir: ./data/temp
jianying:
  enabled: true
  draft_dir: ./data/outputs/jianying_drafts
memory:
  enabled: true
  provider: local
  mem0_api_key: ''
  local_db_path: ./data/memory/mem0.db
  user_id: default_user
server:
  host: 0.0.0.0
  port: 8000
  frontend_port: 3000
  cors_origins:
  - http://localhost:3000
auth:
  enabled: true
  jwt_secret: your-secret-key
  jwt_expire_hours: 24
